<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #icon {
            width: 100px;
            height: 100px;
            background-image: url('/images/images myntra.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            /* we can also use background-shorthand for combine all background properties used for background attributes . example: background: red url('/images/images myntra.png') no-repeat center/contain; */

            /* we can also use visibility property to control the visibility of the element for hide or unhide the element */
        }
    </style>
</head>
<body>
    <div id="icon"></div>
    
    
</body>
</html>
