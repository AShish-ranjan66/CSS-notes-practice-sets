<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- they all are commonly used in transition for make animations using them.  -->
    <style>
        #rotate1  {
            background-color: blueviolet;
            height: 100px;
            width: 100px;
            text-align: center;
            font-size: 30px;
            position: relative;
            top: 50px;
            left: 50px;
            transform: rotatez(45deg);
            /* trransforming 45 deg in z direction and its a default value */


        }  

        #rotate2  {
            background-color: blueviolet;
            height: 100px;
            width: 100px;
            text-align: center;
            font-size: 30px;
            position: relative;
            top: 0px;
            left: 300px;
            transform: rotatex(45deg);
            /* trransforming 45 deg in x direction */


        }  

        #rotate3  {
            background-color: blueviolet;
            height: 100px;
            width: 100px;
            text-align: center;
            font-size: 30px;
            position: relative;
            top: 0px;
            left: 600px;
            transform: rotatey(45deg);
/* trransforming 45 deg in y direction */
        }  

        #scale{
            background-color: brown;
            height: 100px;
            width: 100px;
            text-align: center;
            font-size: 30px;
            transform: scale(2);
            /* it increases the size of the element how much you want to scale like : 2 for 2x, 4 for 4x etc. */

        }

        #translate{
            background-color: brown;
            height: 200px;
            width: 200px;
            text-align: center;
            font-size: 30px;
            position: relative;
            top: 100px;
            left: 100px;
            transform: translatex(50px);

            /* translate used for change the position the element or block on the page in diffrent directions like :- 
            transform: translatex();
             for in x direction.
             transform: translatey(); 
             for in y direction.
             transform: translatez(); 
             for in z direction.
              */
            
        }

        #skew{
            height: 100px;
            width: 100px;
            text-align: center;
            background-color: chocolate;
            transform: skew(45deg);
            position: relative;
            left: 500px;

            /* you can skew any element or block in any direction by using this skew method. */
        }


    </style>
</head>
<body>

    <div id="rotate1"> Rotate</div>
    <div id="rotate2"> Rotate</div>
     <div id="rotate3"> Rotate</div>

     <div id="scale">Scale</div>

     <div id="translate">Translate</div>

     <div id="skew">Skew</div>


</body>
</html>
