<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        #first p {
            color: red;
        }
    </style>

</head>
<body>

    <div id="first">
        <h1>This is a heading inside the first div.</h1><br>
        <p>This is a paragraph inside the first div.</p>
    </div>

    <!-- The above code uses a descendant selector to style the paragraph inside the div with id "first". The paragraph will be colored red. here we have used the color on p tag only using descendant selector -->
</body>
</html>
