<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        #heading {
            font-size: 40px;
            margin-left: 220px;
            
        }
        
        #container{
            height: 600px;
            width: 600px;
            border: 3px solid black;
            background-color: lavender;
            display: flex;
            flex-direction: row-reverse;
            margin: 0;
            justify-content: center;
            flex-wrap: wrap;
            align-items: center;
            align-content: center;

            /* in align-content it arrange the total item without any extra gap and make them arranged in sequence. */
        }

        /* align-items used for align the object at the cross axis.... at start , end , center. */
        
        .box{
            height: 100px;
            width: 100px;
            margin: 10px;
            border: 3px solid black;
            text-align: center;
            border-radius: 15px;
        }
        #box1{
            background-color: aqua;
        }
        #box2{
            background-color: blueviolet;
        }
        #box3{
            background-color: chartreuse;
        }
        #box4{
            background-color: darkblue;
        }
        #box5{
            background-color: chocolate;
        }
        #box6{
            background-color: crimson;
        }
        #box7{
            background-color: darkorange;
        }
    </style>
</head>
<body>
    
    <h1 id="heading">Flex Box <span style="color: darkslateblue; font-size: 10px;">(using align-content: center & align-item:center)</span></h1>
    <div id="container">
        <div id="box1" class="box">box1</div>
        <div id="box2" class="box">box2</div>
        <div id="box3" class="box">box3</div>
        <div id="box4" class="box">box4</div>
        <div id="box5" class="box">box5</div>
        <div id="box6" class="box">box6</div>
        <div id="box7" class="box">box7</div>

       
    </div>

</body>
</html>
