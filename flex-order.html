
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        #heading {
            font-size: 40px;
            margin-left: 220px;
            position: relative;
            right: 200px;
            
        }
        
        #container{
            height: 400px;
            width: 700px;
            border: 3px solid black;
            background-color: lavender;
            display: flex;
            flex-direction: row;
            margin: 0;
        }

        
        .box{
            height: 100px;
            width: 100px;
            margin: 10px;
            border: 3px solid black;
            text-align: center;
            border-radius: 15px;
        }
        #box1{
            background-color: aqua;
            order: 3;
        }
        #box2{
            background-color: blueviolet;
            order: 4;
        }



        #box3{
            background-color: chartreuse;
            order: 2;
        }
        #box4{
            background-color: darkblue;
            order: 1;
        }

        /* order is used for defining the order of the boxs inside the container according to in which order you want them.  */
    </style>
</head>
<body>
    
    <h1 id="heading">Flex Box <span style="color: darkslateblue; font-size: 10px;">(using order property.)</span></h1>
    <div id="container">
        <div id="box1" class="box">box1</div>
        <div id="box2" class="box">box2</div>
        <div id="box3" class="box">box3</div>
        <div id="box4" class="box">box4</div>

       
    </div>

</body>
</html>
