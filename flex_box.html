<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        #heading {
            font-size: 40px;
            margin-left: 220px;
            
        }
        #heading2{
            font-size: 40px;
            position: relative;
            top: -652px;
            left: 940px;
        }
        #container{
            height: 600px;
            width: 600px;
            border: 3px solid black;
            background-color: lavender;
            display: flex;
            flex-direction: row-reverse;
            margin: 0;
        }
        #container2{
            height: 600px;
            width: 600px;
            border: 3px solid black;
            background-color: lavender;
            position: relative;
            left: 700px;
            top: -652px;
            display: flex;
            flex-direction: column-reverse;

        }
        .box{
            height: 70px;
            width: 70px;
            margin: 10px;
            border: 3px solid black;
            text-align: center;
            border-radius: 15px;
        }
        #box1{
            background-color: aqua;
        }
        #box2{
            background-color: blueviolet;
        }
        #box3{
            background-color: chartreuse;
        }
        #box4{
            background-color: darkblue;
        }
    </style>
</head>
<body>
    
    <h1 id="heading">Flex Box <span style="color: darkslateblue; font-size: 10px;">(using row-reverse)</span></h1>
    <div id="container">
        <div id="box1" class="box">box1</div>
        <div id="box2" class="box">box2</div>
        <div id="box3" class="box">box3</div>
        <div id="box4" class="box">box4</div>

       
    </div>

    <h1 id="heading2">Flex Box <span style="color: darkslateblue; font-size: 10px;">(using column-reverse)</span></h1>
    <div id="container2">
        <div id="box1" class="box">box1</div>
        <div id="box2" class="box">box2</div>
        <div id="box3" class="box">box3</div>
        <div id="box4" class="box">box4</div>

        <!-- the boxs inside the container changes its size according to the size of the container you choose or adjust. -->
       
    </div>
</body>
</html>
