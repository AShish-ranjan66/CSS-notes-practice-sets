<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            height: 400px;
            width: 600px;
            padding: 15px;
            margin: 15px;
            border: 3px solid black;
            display: grid;
            grid-template-columns: 100px 100px;
            grid-template-rows: 100px 100px;
            position: relative;
            top: 50px;
            left: 30px;
            background-color: violet;
        }

        .item1{
            grid-column: 1/2;
            grid-row: 1/2;
            background-color: aqua;
        }
        .item2{
            grid-column: 2/2;
            grid-row: 1/2;
            background-color:coral;
        }
        .item3{
            grid-column: 1/2;
            grid-row: 2/2;
            background-color:cornflowerblue;
        }
        .item4{
            grid-column: 2/2;
            grid-row: 2/2;
            background-color:darkgoldenrod;
        }
        #heading{
            font-size: 40px;
            position: relative; 
            top: 70px;
            left: 220px;

        }
    </style>

    <!-- grid used for organise the boxs inside a contiainer in the rows and column or in perticular sequence which you want. -->
</head>
<body>
    <h1 id="heading"> Grid Container</h1>
    
    <div id="container">
        <div class="item1">item 1</div>
        <div class="item2">item 2</div>
        <div class="item3">item 3</div>
        <div class="item4">item 4</div>
    </div>
</body>
</html>
