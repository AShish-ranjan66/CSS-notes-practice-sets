<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />




    <!-- you can also use the Material Symbols font directly in your HTML
     
    note:-
    
    you will get a link from the google for icons like this:-
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=home" />

    you just have to remove some parts from it:-
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    and then add any icon by typing 

    <i class="material-symbols-outlined">search</i> <br>
    by this you will get search icon 


    <i class="material-symbols-outlined">home</i> <br>
    by this you will get home icon 


    <i class="material-symbols-outlined">settings</i> <br>
    by this you will get settings icon

    so just like them you can use diffrent type of icons in the page.....

    
    -->
    
<style>

.material-symbols-outlined {
    font-size: 50px;
  font-variation-settings:
  'FILL' 0,
  'wght' 400,
  'GRAD' 0,
  'opsz' 48
}
</style>


</head>
<body>

<i class="material-symbols-outlined">search</i> <br>
<i class="material-symbols-outlined">home</i> <br>
<i class="material-symbols-outlined">settings</i> <br>
    
    
    
    
</body>
</html>
