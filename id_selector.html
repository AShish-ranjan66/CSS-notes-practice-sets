<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        #main-heading {
            color: blue;
        }
        #paragraph {
            color: red;
        }
        #Second_heading {
            color: green;
        }
        #Third_heading {
            color: yellow;
        }
        #Fourth_heading {
            color: violet;
        }
    </style>
    
    <title>Document</title>
</head>
<body>
    
    <h1 id="main-heading" class="heading">This is a heading</h1>
    <p id="paragraph" class="text">This is a paragraph. Lorem ipsum dolor sit, amet consectetur adipisicing elit. Consectetur, illo.</p>
    

    <div id="Second_heading">This is a second heading</div>
    
    <div id="Third_heading">This is a third heading</div>

    <div id="Fourth_heading">This is a fourth heading</div>

    <!-- id selector is also used to create div elements like this: -->

    

</body>
</html>
