<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        #padding{
            height: 50px;
            width: 50px;
            background-color: darkolivegreen;
            padding: 10px 20px 15px 15px;
            /* you can also define padding like :- padding : 10px; and it automaticaly defines the value of padding is = 10px to all sides. */
        }
    </style>
</head>
<body>
    
    <div id="padding">padding box</div>
</body>
</html>
