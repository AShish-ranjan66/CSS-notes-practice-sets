<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #main-heading {
            color: blue;
        }

        #heading_2 {
            color: green;
        }
        #number-3 {
            color: red;
        }

        #paragraph {
            color: yellow;
        }

        .text-2 {
            color: violet;
        }

        #first , #second {
            color: hotpink;
        }
        </style>
</head>
<body>
    <h1 id="main-heading">This is a heading</h1>
    <div id="heading_2">This is another heading</div>


    <div id="number-3" class="3">This is a div with id number-3 and class 3</div>
    <p id="paragraph">This is a paragraph.</p>
    <h2 class="text-2">This is a second-level heading</h2>

    <div id="first">
        this is a div with id first
    </div>

    <div id="second">
        this is the div with id second 

    </div>


</body>
</html>
