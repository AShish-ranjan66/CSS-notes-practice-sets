<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://kit.fontawesome.com/996af28478.js" crossorigin="anonymous"></script>
    <!-- here i have pasted a link from fontawesome.com for get diffrent type of icons for my web page and exported it using their perticular link for perticular icon which was given there.  -->
    

<Style>
    
 
 *{
    margin: 0;             
    padding: 0;
    font-family:'Times New Roman', Times, serif ;
background-color:burlywood;         

/* so here i have used margin & padding for make the top border connected to web page and create whitespace and structure layouts */
 }
 



    #heading h1{
        background-color: aquamarine;
        text-align: center;
        text-transform: capitalize;
        /* here i have applied text-align centre for move the text to the centre and text-transform for make the text capatalized and changed the background color.  */
    }

    #outer h2{
        font-size: 25px;
        /* her i have applied font size 25px on outer div and targated h2 using id of outer div.  */
    }

    #inner h2{
        font-size: 10px;
        /* her i have applied font size 10px on inner div and targated h2 using id of inner div.  */
    }
    .fa-linkedin{
        font-size: 100px;
        /* here i have increased the size of the icons using font-size */
    }
    .fa-github{
        font-size: 100px;
/* did the same thing. */
}
</Style>


</head>
<body>


<div id="heading">
    <h1>
        capitalized heading

    </h1>
</div>

<br><hr>

<div id="outer">
        <h2>
            outer

        </h2>

        <br><br>

    <div id="inner">

        <h2>
            inner

        </h2>
    </div>
</div>
<br><hr><br>

    <i class="fa-brands fa-linkedin" ></i>
     <br>
     <!-- here i have exported the icons using thier links give below. -->
     <i class="fa-brands fa-github"></i>
