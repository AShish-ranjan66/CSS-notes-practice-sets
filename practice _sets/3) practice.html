<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box1{
            height: 200px;
            width: 200px;
            background-color: aqua;
        }

        #b1{
            height: 70px;
            width: 70px;
            padding: 10px 15px 10px 15px;
            margin: 100px;
            border: 5px dotted red;
            border-radius: 146px;
            background-color:antiquewhite;

        }
        #box2{
            height: 70px;
            width: 70px;
            padding: 50px;
            margin: 50px;
            border: 10px solid black;
            box-sizing: border-box;
            background-color: blueviolet;
        }
        #box3{
            height: 70px;
            width: 70px;
            padding: 50px;
            margin: 50px;
            border: 10px solid black;
            box-sizing: content-box;
            background-color:cadetblue;
        }
    </style>
</head>
<body>
    <div id="box1">
        Box
    </div>

    <button id="b1">
        click Me 
    </button>

<div id="box2">
    box 2
</div>

<div id="box3">
    box 3
</div>
    
</body>
</html>
