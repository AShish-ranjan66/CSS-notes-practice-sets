<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #first {
            height: 200px;
            width: 300px;
            font-size: 20px;
            background-color: cornflowerblue;
            font-size: 30px;

        }

        #second{
            height: 50%;
            width: 30%;
            background-color: blue;
            font-size: 0.7em;
        }

        /* you can define the size of the second element font size according to its parent element for example if you decided the font size of the parent element is = 30px and then the second element font size is 0.7em, then the size of the element is o.7em of the 30px. decide your fontsize according to your font size using the relative unit ( em ).  */
        
    </style>
</head>
<body>
    <div id="first">
        
        first div

        <div id="second">
            
            second div

        </div>
    </div>
    

</body>
</html>
