<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #first {
            height: 200px;
            width: 300px;
            background-color: cornflowerblue;
            font-size: 30px;

        }

        #second{
            height: 50%;
            width: 30%;
            background-color: blue;
            font-size: 30px;
        }

        /* relative unit % used for define the value how much space you want cover inside or if outside the element or block in form of percentage means if the box height is 300px  and width is 150px and you gave the value for the second one is height 50% and width 30%. so it cover only the 50% of the 300px height and 30% of 150px width. it directly depends on size of the outer layer box.  */
        
    </style>
</head>
<body>
    <div id="first">
        
        first div

        <div id="second">
            
            second div

        </div>
    </div>
    

</body>
</html>
