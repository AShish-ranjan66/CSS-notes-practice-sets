<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{
            margin: 0; padding: 0;
            font-size: 30px;
        }
        #first {
            height: 200px;
            width: 300px;
            font-size: 20px;
            background-color: cornflowerblue;
            font-size: 30px;

        }

        #second{
            height: 50%;
            width: 30%;
            background-color: blue;
            font-size: 0.5rem;
            /* in rem the size of the inner text depends upon the size of the outer text font size. is the outer text have 30px and rem is 0.5 then the inner text size will be o.5rem of the 30px. it directly depends upon the font-size of the outer text.  */
        }

        
    </style>
</head>
<body>
    outer text
    <div id="first">
        
        first div

        <div id="second">
            
            second div

        </div>
    </div>
