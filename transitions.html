<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            background-color: aquamarine;
        }

        #h1{
            font-size: 40px;
            background-color: darkcyan;
            text-align: center;
        }

        #btn{
            height: 50px;
            width: 100px;
            position: relative;
            top: 300px;
            left: 350px;
            background-color: antiquewhite;
            border-radius: 10px;
            border: 2px solid black;

            transition-property: all;
            transition-duration: 1s;
            transition-timing-function:ease-in-out;
            transition-delay: 0s;

            /* you can also apply directly transition function in one line like:-
            
            transition: all 1s ease-in-out 0s;
            
            */

        }

        #btn:hover{
            height: 60px;
            width: 120px;
            border: 2px solid blue;
            border-radius: 10px;
            background-color: aqua;
        }

        #btn:active{
            height: 60px;
            width: 120px;
            border: 2px solid blue;
            background-color: rgb(41, 41, 238);
        }
    </style>
</head>


<body>

    <h1 id="h1">
        Using Pseudo Class 
    </h1>
    <button id="btn">
        click Me
    </button>
</body>
</html>
