<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;

        }
        #first{
            background-color: aqua;
            height: 20vh;
            width: 50vw;
        }

        /* the vh and vw used for defining the value like height = 20vh means 20 percent of height covered of the page and same in vw also like 50vw is 50 percent of width covered from the page. */
        
    </style>
</head>
<body>
    
    <div id="first">

        first div
    </div>
</body>
</html>
